<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Arena Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg-color: #000000;
            --accent-color: #1DCD9F;
            --text-color: #1DCD9F;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, #222222 2px, #222222 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, #222222 2px, #222222 4px);
            background-size: 20px 20px;
            font-family: 'Outfit', sans-serif;
            color: var(--text-color);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #character-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            pointer-events: auto;
        }

        .character-card {
            background: #222222;
            border: 2px solid #169976;
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 4px;
            transition: all 0.3s;
        }

        .character-card.alive {
            border-left: 4px solid #1DCD9F;
            background: #000000;
            border-color: #1DCD9F;
        }

        .character-card.dead {
            opacity: 0.4;
            border-left: 4px solid #169976;
            background: #000000;
            border-color: #169976;
            text-decoration: line-through;
        }

        .character-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .character-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .character-card.dead .character-color-dot {
            opacity: 0.3;
        }

        .character-name {
            font-weight: 600;
            font-size: 0.85rem;
            flex: 1;
        }

        .character-card.dead .character-name {
            color: #169976;
        }

        .character-hp {
            font-size: 0.8rem;
            color: #1DCD9F;
        }

        .character-card.dead .character-hp {
            color: #169976;
        }

        .stat-bar {
            height: 4px;
            background: #000000;
            border: 1px solid #169976;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .hp-bar {
            background: #1DCD9F;
        }

        .hp-bar.medium {
            background: #169976;
        }

        .hp-bar.low {
            background: #169976;
        }

        .stat-bar {
            height: 4px;
            background: #000000;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .hp-bar {
            background: #1DCD9F;
        }

        .hp-bar.low {
            background: #169976;
        }

        #character-panel::-webkit-scrollbar {
            width: 6px;
        }

        #character-panel::-webkit-scrollbar-track {
            background: #000000;
            border-radius: 3px;
        }

        #character-panel::-webkit-scrollbar-thumb {
            background: #1DCD9F;
            border-radius: 3px;
        }

        #minimap {
            position: absolute;
            top: 20px;
            right: 310px;
            width: 200px;
            height: 200px;
            border: 3px solid #1DCD9F;
            border-radius: 4px;
            background: #000000;
            box-shadow: 0 0 0 2px #169976;
            pointer-events: none;
        }

        #minimap canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .glass-panel {
            background: #222222;
            border: 2px solid #1DCD9F;
            border-radius: 4px;
            padding: 16px;
            box-shadow: 0 0 0 2px #169976, 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        .shared-panel {
            margin-top: 12px;
            pointer-events: auto;
            display: flex;
            justify-content: flex-end;
        }
        .shared-panel button {
            border-radius: 4px;
            border: 2px solid #169976;
            background: #1DCD9F;
            color: #000000;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 0 #169976, 0 0 0 2px #000000;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000000, 4px 4px 0 #169976;
        }

        #stats {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #winner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 100;
        }

        #winner-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-card {
            text-align: center;
            padding: 40px;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #winner-overlay.active .winner-card {
            transform: scale(1);
        }

        .winner-title {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #1DCD9F;
            text-shadow: 2px 2px 0 #000000, 4px 4px 0 #169976, 0 0 20px rgba(29, 205, 159, 0.5);
        }

        .winner-name {
            font-size: 4rem;
            font-weight: 800;
            margin: 0;
            color: #1DCD9F;
            text-shadow: 2px 2px 0 #000000, 4px 4px 0 #169976;
        }
    </style>
</head>

<body>
    <div id="ui-layer">
        <div class="glass-panel">
            <h1>Simulation Arena</h1>
            <div id="stats">생존자: 20 | 시간: 0초</div>
        </div>
        <div id="shared-panel" class="glass-panel shared-panel">
            <button id="goHubBtn" type="button">카테고리로 돌아가기</button>
        </div>
    </div>

    <div id="minimap">
        <canvas id="minimapCanvas"></canvas>
    </div>

    <div id="character-panel" class="glass-panel">
        <h2 style="margin: 0 0 12px 0; font-size: 1.1rem; color: var(--accent-color);">캐릭터 상태</h2>
        <div id="character-list"></div>
    </div>

    <div id="winner-overlay">
            <div class="glass-panel winner-card">
                <div class="winner-title">승리</div>
                <h2 class="winner-name" id="winner-name">이름</h2>
                <p>마지막 생존자</p>
                <button onclick="location.reload()"
                    style="margin-top: 20px; padding: 10px 20px; background: var(--accent-color); border: none; border-radius: 6px; color: #0f172a; font-weight: bold; cursor: pointer;">다시하기</button>
            </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Configuration ---
        const MIN_CHARACTER_COUNT = 4;
        const DEFAULT_CHARACTER_NAMES = ['용사', '마법사', '궁수', '전사', '도적', '성기사', '사제', '흑마법사', '드루이드', '주술사', '암살자', '검투사', '창기사', '마법검사', '사냥꾼', '수호자', '파괴자', '치유사', '소환사', '기사'];
        let CHARACTER_NAMES = [...DEFAULT_CHARACTER_NAMES];
        const TERRAIN_FEATURES = [
            { type: 'circle', x: -1200, y: -800, radius: 250, color: 'rgba(15, 52, 96, 0.6)' },
            { type: 'circle', x: 900, y: -600, radius: 300, color: 'rgba(35, 78, 112, 0.5)' },
            { type: 'rect', x: -500, y: 600, width: 600, height: 200, color: 'rgba(29, 53, 87, 0.5)' },
            { type: 'rect', x: 700, y: 700, width: 400, height: 250, color: 'rgba(17, 24, 39, 0.45)' }
        ];

        // 맵 크기 계산 함수 (인원수에 따라, 10명마다 변화, 최대 30명)
        function calculateMapRadius(entityCount) {
            const tier = Math.min(Math.floor(entityCount / 10), 3); // 0, 1, 2, 3 (최대 30명)
            const baseRadius = 3000; // 기본 반경
            const radiusPerTier = 1000; // 10명마다 1000씩 증가
            return baseRadius + (tier * radiusPerTier);
        }

        const CONFIG = {
            entityCount: CHARACTER_NAMES.length,
            initialItemCount: 15, // 초기 아이템 수를 늘려 초반 자원 강화
            get mapRadius() { 
                return calculateMapRadius(this.entityCount); 
            },
            safeZone: {
                startDelay: 10, // 자기장 시작 지연 시간 (초)
                get initialRadius() {
                    return CONFIG.mapRadius * 0.9; // 맵 크기의 90%
                },
                shrinkRate: 2.0, // 초당 좁혀지는 비율 (훨씬 더 빨리)
                damagePerSecond: 5 // 자기장 밖 데미지
            },
            colors: [
                '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981',
                '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef',
                '#f43f5e', '#fb7185', '#e879f9', '#a78bfa', '#818cf8',
                '#60a5fa', '#38bdf8', '#2dd4bf', '#34d399', '#a3e635'
            ]
        };

        // --- Utils ---
        const random = (min, max) => Math.random() * (max - min) + min;
        const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

        // --- Sound System ---
        class SoundManager {
            constructor() {
                this.audioContext = null;
                this.masterVolume = 0.32; // 80%로 감소 (0.4 * 0.8 = 0.32)
                this.initialized = false;
                this.init();
            }

            init() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    // 사용자 인터랙션 후 오디오 컨텍스트 활성화
                    document.addEventListener('click', () => this.resumeAudio(), { once: true });
                    document.addEventListener('keydown', () => this.resumeAudio(), { once: true });
                } catch (e) {
                    console.log('Audio not supported');
                }
            }

            async resumeAudio() {
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    try {
                        await this.audioContext.resume();
                        this.initialized = true;
                    } catch (e) {
                        console.log('Audio resume failed');
                    }
                }
            }

            playTone(frequency, duration, type = 'sine', volume = 0.1, distance = 0) {
                if (!this.audioContext) return;

                // 오디오 컨텍스트가 suspended 상태면 resume 시도
                if (this.audioContext.state === 'suspended') {
                    this.resumeAudio();
                    return;
                }

                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);

                    oscillator.frequency.value = frequency;
                    oscillator.type = type;

                    // 거리 기반 볼륨 조절 (최대 거리 1000, 그 이상은 거의 안 들림)
                    const maxDistance = 1000;
                    const distanceVolume = distance > 0 ? Math.max(0.1, 1 - (distance / maxDistance)) : 1;

                    gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(volume * this.masterVolume * distanceVolume, this.audioContext.currentTime + 0.01);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);

                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + duration);
                } catch (e) {
                    // 사운드 재생 실패 시 무시
                }
            }

            playAttack(distance = 0) {
                this.playTone(400, 0.1, 'square', 0.15, distance);
            }

            playHit(distance = 0) {
                this.playTone(200, 0.15, 'sawtooth', 0.2, distance);
            }

            playDeath(distance = 0) {
                const freq = 150;
                this.playTone(freq, 0.3, 'sawtooth', 0.25, distance);
                setTimeout(() => this.playTone(freq * 0.5, 0.2, 'sawtooth', 0.2, distance), 100);
            }

            playItemPickup(distance = 0) {
                this.playTone(600, 0.1, 'sine', 0.15, distance);
                setTimeout(() => this.playTone(800, 0.1, 'sine', 0.15, distance), 50);
            }

            playKill(distance = 0) {
                this.playTone(500, 0.1, 'square', 0.2, distance);
                setTimeout(() => this.playTone(700, 0.1, 'square', 0.2, distance), 50);
                setTimeout(() => this.playTone(900, 0.1, 'square', 0.2, distance), 100);
            }

            playZoneDamage(distance = 0) {
                this.playTone(150, 0.2, 'sawtooth', 0.15, distance);
            }

            playZoneWarning() {
                this.playTone(300, 0.3, 'sine', 0.1);
            }

            playCombatStart(distance = 0) {
                this.playTone(400, 0.15, 'square', 0.18, distance);
                setTimeout(() => this.playTone(500, 0.1, 'square', 0.15, distance), 50);
            }

            playMovement() {
                // 배경음악 대신 미묘한 사운드
                if (Math.random() < 0.01) {
                    this.playTone(200 + Math.random() * 100, 0.05, 'sine', 0.05);
                }
            }
        }

        const soundManager = new SoundManager();
        const ZUSTAND_STORAGE_KEY = 'roulette-items';
        const goHubBtn = document.getElementById('goHubBtn');
        let activeGame = null;

        const sanitizeList = list => list.map(name => name.trim()).filter(Boolean);
        const logShared = (message) => console.log(`[Arena] ${message}`);

        function loadSharedItems(minRequired = MIN_CHARACTER_COUNT) {
            try {
                const raw = localStorage.getItem(ZUSTAND_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                // Zustand persist 형식: { state: { items: [...] } } 또는 직접 { items: [...] }
                let items = null;
                if (parsed.state && Array.isArray(parsed.state.items)) {
                    items = parsed.state.items;
                } else if (Array.isArray(parsed.items)) {
                    items = parsed.items;
                }
                if (!items) return null;
                const clean = sanitizeList(items);
                return clean.length >= minRequired ? clean : null;
            } catch (e) {
                return null;
            }
        }

        function applySharedCharacters(list, message) {
            CHARACTER_NAMES = list.slice();
            CONFIG.entityCount = CHARACTER_NAMES.length;
            const preview = list.slice(0, 5).join(', ');
            const suffix = list.length ? ` (예: ${preview}${list.length > 5 ? '…' : ''})` : '';
            logShared(`${message}${suffix}`);
        }

        function useDefaultCharacters(message) {
            CHARACTER_NAMES = DEFAULT_CHARACTER_NAMES.slice();
            CONFIG.entityCount = CHARACTER_NAMES.length;
            const preview = CHARACTER_NAMES.slice(0, 5).join(', ');
            const suffix = CHARACTER_NAMES.length ? ` (예: ${preview}${CHARACTER_NAMES.length > 5 ? '…' : ''})` : '';
            logShared(`${message}${suffix}`);
        }

        function hydrateCharacterList(options = { alertOnMissing: false, restart: false }) {
            const shared = loadSharedItems();
            if (shared) {
                applySharedCharacters(shared, `카테고리 페이지에서 전달된 참가자 ${shared.length}명을 사용합니다.`);
                if (options.restart) startSimulation();
                return true;
            }
            if (options.alertOnMissing) {
                alert('공유된 참가자 목록을 찾을 수 없습니다. 카테고리 페이지에서 항목을 설정해 주세요.');
            }
            useDefaultCharacters(`공유 항목이 없어 기본 참가자 ${DEFAULT_CHARACTER_NAMES.length}명을 사용합니다.`);
            if (options.restart) startSimulation();
            return false;
        }

        function startSimulation() {
            if (activeGame && typeof activeGame.destroy === 'function') {
                activeGame.destroy();
            }
            const statsEl = document.getElementById('stats');
            if (statsEl) {
                statsEl.innerText = `생존자: ${CONFIG.entityCount} | 시간: 0초`;
            }
            const winnerOverlay = document.getElementById('winner-overlay');
            if (winnerOverlay) {
                winnerOverlay.classList.remove('active');
            }
            activeGame = new Game();
        }

        if (goHubBtn) {
            goHubBtn.addEventListener('click', () => {
                window.location.href = '/';
            });
        }

        // --- Classes ---
        class Vector2 {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            sub(v) { this.x -= v.x; this.y -= v.y; return this; }
            mult(n) { this.x *= n; this.y *= n; return this; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() {
                const m = this.mag();
                if (m > 0) this.mult(1 / m);
                return this;
            }
            copy() { return new Vector2(this.x, this.y); }
        }

        // --- Safe Zone Class ---
        class SafeZone {
            constructor() {
                this.center = new Vector2(0, 0); // 맵 중심
                this.radius = CONFIG.safeZone.initialRadius; // getter 사용
                this.targetRadius = CONFIG.safeZone.initialRadius; // getter 사용
                this.active = false; // 자기장 활성화 여부
                this.startTime = 0;
            }
            
            getInitialRadius() {
                return CONFIG.safeZone.initialRadius; // getter 호출
            }

            update(game) {
                // 자기장 시작 지연
                if (!this.active && game.time >= CONFIG.safeZone.startDelay) {
                    this.active = true;
                    this.startTime = game.time;
                }

                if (!this.active) return;

                // 생존자 수에 따라 자기장 크기 조정
                const aliveCount = game.characters.filter(c => c.alive).length;
                const progress = 1 - (aliveCount / CONFIG.entityCount);
                
                // 최소 반경 설정 (너무 작아지지 않도록)
                const minRadius = 300;
                const elapsed = game.time - this.startTime;
                
                // 시간에 따라 점진적으로 좁혀짐 (항상 줄어들도록)
                // 100초에 걸쳐 0.7까지 좁혀짐
                const timeShrink = Math.min(0.7, elapsed / 100);
                // 생존자 수에 따라 추가로 최대 0.3까지 좁혀짐
                const playerShrink = progress * 0.3;
                
                // 두 가지 요소를 결합하여 자기장 크기 결정 (최대 0.9까지 좁혀짐)
                const totalShrink = Math.min(0.9, timeShrink + playerShrink);
                this.targetRadius = Math.max(minRadius, this.getInitialRadius() * (1 - totalShrink));
                
                // 부드럽게 좁혀짐 (더 빠르게)
                const shrinkSpeed = 0.15; // 고정된 속도로 빠르게
                this.radius += (this.targetRadius - this.radius) * shrinkSpeed;
            }

            isInside(pos) {
                if (!this.active) return true; // 자기장이 시작되기 전에는 항상 안전
                const dist = distance(pos, this.center);
                return dist <= this.radius;
            }

            draw(ctx) {
                if (!this.active) return;

                // 자기장 경계선
                ctx.strokeStyle = '#169976';
                ctx.lineWidth = 8;
                ctx.setLineDash([10, 5]);
                ctx.beginPath();
                ctx.arc(this.center.x, this.center.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // 자기장 외부 영역 표시
                ctx.fillStyle = 'rgba(22, 153, 118, 0.1)';
                ctx.beginPath();
                ctx.arc(this.center.x, this.center.y, this.radius + 50, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Camera {
            constructor(width, height) {
                this.x = 0;
                this.y = 0;
                this.width = width;
                this.height = height;
                this.zoom = 1.2; // 줌 약하게
                this.targetZoom = 1.2;
                this.focusTarget = null; // 포커스할 캐릭터
                this.combatFocusTime = 0; // 전투 포커스 시간
                this.combatEndTime = 0; // 전투 종료 후 유지 시간
                this.focusChangeCooldown = 0; // 포커스 변경 쿨다운
                this.currentFocusChar = null; // 현재 포커스 중인 캐릭터
                this.isInCombat = false; // 전투 중 여부
                this.viewRotationTimer = 0; // 뷰 순환 타이머
                this.viewRotationInterval = 300; // 5초마다 뷰 변경 (60fps 기준)
                this.viewRotationIndex = 0; // 현재 뷰 인덱스
            }

            update(targets, game) {
                if (targets.length === 0) return;

                // 전투 중인 캐릭터 찾기
                let combatChars = [];
                let hasActiveCombat = false;

                targets.forEach(char => {
                    // 공격 상태이거나 추격 중이고 타겟이 살아있을 때
                    if ((char.state === 'attack' || char.state === 'chase') && char.target && char.target.alive) {
                        const dist = distance(char.pos, char.target.pos);
                        if (dist < 400) { // 거리 조건
                            combatChars.push(char);
                            hasActiveCombat = true;
                        }
                    }
                });

                // 전투 상태 업데이트
                if (hasActiveCombat && combatChars.length >= 1) {
                    if (!this.isInCombat) {
                        // 전투 시작
                        this.isInCombat = true;
                        this.combatEndTime = 0;
                        this.viewRotationTimer = 0; // 전투 시작 시 타이머 리셋
                    }
                    this.combatFocusTime = 999999; // 전투 중에는 계속 유지
                    
                    // 전투 중인 캐릭터 중 가장 많은 킬을 가진 캐릭터를 포커스
                    const combatFocusChar = combatChars.reduce((best, current) => 
                        (current.kills > (best?.kills || 0)) ? current : best, combatChars[0]
                    );
                    
                    // 전투 중일 때는 포커스 변경 쿨다운 무시하고 전투 캐릭터를 따라감
                    if (this.currentFocusChar !== combatFocusChar) {
                        this.currentFocusChar = combatFocusChar;
                        this.focusTarget = combatFocusChar;
                        this.focusChangeCooldown = 999999; // 전투 중에는 쿨다운 무한대
                    }
                } else {
                    // 전투 종료
                    if (this.isInCombat) {
                        this.isInCombat = false;
                        this.combatEndTime = 120; // 전투 종료 후 2초 유지
                        this.combatFocusTime = 0;
                    }
                    
                    // 전투 종료 후 유지 시간 감소
                    if (this.combatEndTime > 0) {
                        this.combatEndTime--;
                        // 전투 종료 후 2초간은 현재 포커스 유지
                        this.focusChangeCooldown = this.combatEndTime;
                    } else {
                        // 전투 종료 후 2초가 지나면 포커스 변경 쿨다운 감소
                        this.focusChangeCooldown = Math.max(0, this.focusChangeCooldown - 1);
                    }
                }

                // 포커스 변경 로직 (전투 중이 아니고 쿨다운이 없을 때만)
                if (!this.isInCombat && this.combatEndTime === 0) {
                    // 뷰 순환 타이머 증가
                    this.viewRotationTimer++;
                    
                    // 일정 시간마다 또는 쿨다운이 끝났을 때 포커스 변경
                    if (this.viewRotationTimer >= this.viewRotationInterval || 
                        (this.focusChangeCooldown === 0 && (!this.currentFocusChar || !this.currentFocusChar.alive))) {
                        
                        // 살아있는 캐릭터들을 킬 수 순으로 정렬
                        const sortedTargets = [...targets].sort((a, b) => b.kills - a.kills);
                        
                        if (sortedTargets.length > 0) {
                            // 현재 포커스 캐릭터를 제외하고 다음 캐릭터 선택
                            let nextIndex = this.viewRotationIndex;
                            
                            // 현재 포커스가 있으면 그 다음 캐릭터로
                            if (this.currentFocusChar && sortedTargets.includes(this.currentFocusChar)) {
                                const currentIndex = sortedTargets.indexOf(this.currentFocusChar);
                                nextIndex = (currentIndex + 1) % sortedTargets.length;
                            } else {
                                // 현재 포커스가 없으면 다음 인덱스로
                                nextIndex = (this.viewRotationIndex + 1) % sortedTargets.length;
                            }
                            
                            // 다음 캐릭터 선택
                            const nextChar = sortedTargets[nextIndex];
                            
                            if (nextChar && nextChar.alive) {
                                this.currentFocusChar = nextChar;
                                this.focusTarget = nextChar;
                                this.viewRotationIndex = nextIndex;
                                this.viewRotationTimer = 0; // 타이머 리셋
                                this.focusChangeCooldown = 120; // 2초간 포커스 변경 방지
                            }
                        }
                    }
                    
                    // 쿨다운 감소
                    if (this.focusChangeCooldown > 0) {
                        this.focusChangeCooldown--;
                    }
                }

                // 포커스가 없으면 살아있는 캐릭터 중 첫 번째로 설정
                if (!this.focusTarget) {
                    const aliveTargets = targets.filter(t => t.alive);
                    if (aliveTargets.length > 0) {
                        const sortedTargets = [...aliveTargets].sort((a, b) => b.kills - a.kills);
                        this.currentFocusChar = sortedTargets[this.viewRotationIndex % sortedTargets.length];
                        this.focusTarget = this.currentFocusChar;
                    } else if (this.currentFocusChar && this.currentFocusChar.alive) {
                        this.focusTarget = this.currentFocusChar;
                    }
                }

                // 현재 포커스 캐릭터가 사망했을 때
                if (this.focusTarget && this.focusTarget.alive === false) {
                    // 살아있는 캐릭터 중에서 다음 캐릭터 선택
                    const aliveTargets = targets.filter(t => t.alive);
                    if (aliveTargets.length > 0) {
                        const sortedTargets = [...aliveTargets].sort((a, b) => b.kills - a.kills);
                        this.viewRotationIndex = (this.viewRotationIndex + 1) % sortedTargets.length;
                        const nextChar = sortedTargets[this.viewRotationIndex];
                        this.currentFocusChar = nextChar;
                        this.focusTarget = nextChar;
                        this.viewRotationTimer = 0; // 타이머 리셋
                    }
                }

                if (!this.focusTarget) return;

                const centerX = this.focusTarget.pos.x;
                const centerY = this.focusTarget.pos.y;

                // Target position
                const targetX = centerX - this.width / (2 * this.zoom);
                const targetY = centerY - this.height / (2 * this.zoom);

                // 더 부드럽게 따라가기 (너무 빠르게 움직이지 않도록)
                this.x += (targetX - this.x) * 0.08;
                this.y += (targetY - this.y) * 0.08;

                // 전투 중일 때 확대 (더 명확하게)
                if (this.isInCombat || this.combatEndTime > 0) {
                    this.targetZoom = 1.6; // 전투 중 더 크게 확대
                } else {
                    this.targetZoom = 1.2; // 일반 상태
                }
                this.zoom += (this.targetZoom - this.zoom) * 0.05; // 줌 변화 속도 증가
            }

            apply(ctx) {
                ctx.save();
                ctx.scale(this.zoom, this.zoom);
                ctx.translate(-this.x, -this.y);
            }

            reset(ctx) {
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, speed = 2) {
                this.pos = new Vector2(x, y);
                this.vel = new Vector2(random(-1, 1), random(-1, 1)).normalize().mult(random(1, speed));
                this.life = 1.0;
                this.decay = random(0.02, 0.05);
                this.color = color;
                this.size = random(2, 5);
            }

            update() {
                this.pos.add(this.vel);
                this.life -= this.decay;
                this.size *= 0.95;
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class Projectile {
            constructor(owner, x, y, target, type, damageOverride = null) {
                this.owner = owner;
                this.pos = new Vector2(x, y);
                this.targetPos = target.pos.copy();
                this.vel = this.targetPos.copy().sub(this.pos).normalize().mult(type === 'bullet' ? 15 : 8);
                this.type = type; // 'arrow', 'bullet', 'magic', 'grenade', 'cannon'
                this.active = true;
                this.damage = damageOverride != null ? damageOverride : owner.damage;
                this.life = 50; // 발사체 수명 단축
                this.isExplosive = (type === 'grenade' || type === 'cannon');
                this.isPiercing = (type === 'arrow'); // 활은 관통 효과
                this.hitTargets = []; // 관통 시 이미 맞은 적 추적

                if (this.isExplosive) {
                    this.vel.mult(0.5);
                    this.targetPos = target.pos.copy(); // Grenade goes to location
                }
            }

            update(game) {
                this.pos.add(this.vel);
                this.life--;

                if (this.isExplosive) {
                    if (distance(this.pos, this.targetPos) < 10 || this.life <= 0) {
                        this.explode(game);
                    }
                } else {
                    // Check collision
                    for (let other of game.characters) {
                        if (other === this.owner || !other.alive) continue;
                        if (this.hitTargets.includes(other)) continue; // 이미 맞은 적은 스킵
                        if (distance(this.pos, other.pos) < other.size + 5) {
                            other.takeDamage(this.damage, this.owner, game);
                            this.hitTargets.push(other); // 맞은 적 기록
                            game.addParticle(this.pos.x, this.pos.y, '#fff', 5);
                            
                            // 관통 효과: 활은 최대 2명까지 관통, 다른 투사체는 첫 적 맞으면 종료
                            if (!this.isPiercing || this.hitTargets.length >= 2) {
                                this.active = false;
                                break;
                            }
                        }
                    }
                }

                // 원형 맵 경계 체크
                const distFromCenter = distance(this.pos, new Vector2(0, 0));
                if (distFromCenter > CONFIG.mapRadius) {
                    this.active = false;
                }
            }

            explode(game) {
                this.active = false;
                game.addParticle(this.pos.x, this.pos.y, '#f97316', 20); // Explosion visual
                // AOE Damage
                for (let other of game.characters) {
                    if (!other.alive) continue;
                    const d = distance(this.pos, other.pos);
                    if (d < 100) {
                        other.takeDamage(this.damage * 1.5, this.owner, game);
                    }
                }
            }

            draw(ctx) {
                ctx.fillStyle = this.type === 'magic' ? '#1DCD9F' : '#1DCD9F';
                ctx.beginPath();
                if (this.isExplosive) {
                    ctx.arc(this.pos.x, this.pos.y, 6, 0, Math.PI * 2);
                } else {
                    ctx.arc(this.pos.x, this.pos.y, 3, 0, Math.PI * 2);
                }
                ctx.fill();
            }
        }

            FRENZY_SERUM: { type: 'buff', name: '광폭 혈청', color: '#fb7185', buffKey: 'RAGE' },
