        const ITEM_LOOT_KEYS = Object.keys(ITEM_TYPES).filter(key => key !== 'SWORD' && key !== 'BOW');

        class Item {
            constructor(id, x, y, forcedType = null) {
                this.id = id;
                this.pos = new Vector2(x, y);
                this.size = 12;
                this.active = true;

                // Random Type
                const keys = forcedType ? [forcedType] : ITEM_LOOT_KEYS.length ? ITEM_LOOT_KEYS : Object.keys(ITEM_TYPES);
                const key = keys[Math.floor(Math.random() * keys.length)];
                this.data = ITEM_TYPES[key];

                this.floatOffset = random(0, Math.PI * 2);
                this.exploding = false;
                this.timer = 0;
                this.triggeredBy = null;
            }

            update(game) {
                if (this.data.type !== 'trap') return;
                if (!this.exploding) return;

                if (this.timer > 0) {
                    this.timer--;
                    return;
                }

                // 폭발 처리 (한 번만 실행)
                this.active = false;
                this.exploding = false;
                this.timer = 0;

                game.addParticle(this.pos.x, this.pos.y, '#169976', 20);
                game.addFloatingText('폭발!', this.pos.x, this.pos.y - 20, '#169976');

                game.characters.forEach(char => {
                    if (!char.alive) return;
                    if (distance(char.pos, this.pos) < 120) {
                        char.takeDamage(this.data.damage, null, game);
                    }
                });
            }

            draw(ctx, time) {
                if (!this.active) return;
                const floatY = Math.sin(time * 3 + this.floatOffset) * 4;

                if (this.data.type === 'trap') {
                    // Draw X for trap
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = this.data.color;
                    ctx.strokeStyle = this.data.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.pos.x - 8, this.pos.y - 8);
                    ctx.lineTo(this.pos.x + 8, this.pos.y + 8);
                    ctx.moveTo(this.pos.x + 8, this.pos.y - 8);
                    ctx.lineTo(this.pos.x - 8, this.pos.y + 8);
                    ctx.stroke();

                    if (this.exploding) {
                        ctx.strokeStyle = '#1DCD9F';
                        ctx.setLineDash([3, 3]);
                        ctx.beginPath();
                        ctx.arc(this.pos.x, this.pos.y, 40 + Math.sin(time * 10) * 10, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    ctx.shadowBlur = 0;
                } else {
                    // 아이템 박스 디자인
                    const boxSize = 20;
                    const boxY = this.pos.y + floatY;
                    
                    // 박스 배경
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(this.pos.x - boxSize/2, boxY - boxSize/2, boxSize, boxSize);
                    
                    // 박스 테두리 (발광 효과)
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.data.color;
                    ctx.strokeStyle = this.data.color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(this.pos.x - boxSize/2, boxY - boxSize/2, boxSize, boxSize);
                    
                    // 내부 아이콘/원
                    ctx.fillStyle = this.data.color;
                    ctx.beginPath();
                    ctx.arc(this.pos.x, boxY, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 펄스 효과
                    const pulse = Math.sin(time * 5 + this.floatOffset) * 0.3 + 0.7;
                    ctx.globalAlpha = pulse;
                    ctx.strokeStyle = this.data.color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.pos.x, boxY, 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                    
                    ctx.shadowBlur = 0;
                }

                // Label
                ctx.fillStyle = '#1DCD9F';
                ctx.font = '10px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText(this.data.name, this.pos.x, this.pos.y - 25 + floatY);
            }
        }

        class Character {
            constructor(id, name, color, x, y) {
                this.id = id;
                this.name = name;
                this.color = color;
                this.pos = new Vector2(x, y);
                this.vel = new Vector2(0, 0);
                this.size = 15;
                this.baseSpeed = 3.5; // 기본 속도
                this.maxHealth = 100;
                this.health = this.maxHealth;
                this.damage = 10;
                this.defense = 0;
                this.weapon = ITEM_TYPES.PISTOL; // 기본 무기: 권총
                this.detectRange = 800; // 감지 범위 증가 (더 적극적으로)
                this.cooldown = 0;
                this.maxCooldown = 30;
                this.state = 'wander';
                this.target = null;
                this.alive = true;
                this.kills = 0;
                this.stunned = false; // 스턴 상태
                this.stunTime = 0; // 스턴 지속 시간
                this.weaponSpeedMultiplier = 1.2; // 맨손일 때 가장 빠름
                this.speedBonus = 0;
                this.facingAngle = Math.random() * Math.PI * 2;
                this.updateWeaponSpeed();
                this.stuckTimer = 0;
                this.activeBuffs = [];
            }

            getMoveSpeed() {
                return (this.baseSpeed * this.weaponSpeedMultiplier) + this.speedBonus;
            }

            updateWeaponSpeed() {
                if (!this.weapon) {
                    this.weaponSpeedMultiplier = 1.2;
                    return;
                }

                const name = this.weapon.name;
                if (name.includes('칼')) {
                    this.weaponSpeedMultiplier = 1.1; // 칼은 맨손보다 약간 느리지만 빠름
                } else if (name.includes('권총')) {
                    this.weaponSpeedMultiplier = 0.85; // 권총은 소총보다 느림
                } else if (name.includes('소총')) {
                    this.weaponSpeedMultiplier = 0.8;
                } else if (name.includes('마법')) {
                    this.weaponSpeedMultiplier = 0.9;
                } else if (name.includes('대포')) {
                    this.weaponSpeedMultiplier = 0.85;
                } else {
                    this.weaponSpeedMultiplier = 1.0;
                }
            }

            teleportNearCenter(game) {
                const safeRadius = game.safeZone && game.safeZone.radius ? game.safeZone.radius : CONFIG.mapRadius * 0.1;
                const maxRadius = Math.max(80, Math.min(600, safeRadius * 0.2));
                const distance = random(40, maxRadius);
                const angle = random(0, Math.PI * 2);
                this.pos.x = Math.cos(angle) * distance;
                this.pos.y = Math.sin(angle) * distance;
                this.vel.x = 0;
                this.vel.y = 0;
            }

            // 카메라 뷰 안에 있는지 확인
            isInCameraView(camera) {
                if (!camera || !camera.focusTarget) return false;
                const viewWidth = camera.width / camera.zoom;
                const viewHeight = camera.height / camera.zoom;
                const camX = camera.x + viewWidth / 2;
                const camY = camera.y + viewHeight / 2;
                const dist = distance(this.pos, new Vector2(camX, camY));
                return dist < Math.max(viewWidth, viewHeight) * 0.8;
            }
            
            // 카메라와의 거리 계산
            getDistanceToCamera(camera) {
                if (!camera || !camera.focusTarget) return 0;
                const viewWidth = camera.width / camera.zoom;
                const viewHeight = camera.height / camera.zoom;
                const camX = camera.x + viewWidth / 2;
                const camY = camera.y + viewHeight / 2;
                return distance(this.pos, new Vector2(camX, camY));
            }

            update(game) {
                if (!this.alive) return;

                this.updateBuffs(game);

                // 스턴 상태 업데이트
                if (this.stunned) {
                    this.stunTime--;
                    if (this.stunTime <= 0) {
                        this.stunned = false;
                    } else {
                        // 스턴 중에는 행동 불가
                        return;
                    }
                }

                if (this.cooldown > 0) this.cooldown--;

                // 자기장 체크 (매 프레임마다) - 가장 먼저 처리
                if (!game.safeZone.isInside(this.pos)) {
                    // 자기장 밖 데미지 (10 데미지 고정)
                    this.takeDamage(10, null, game);
                    
                    // 맵 중앙 근처의 랜덤한 위치로 순간이동
                    this.teleportNearCenter(game);
                    
                    // 자기장 데미지 사운드 (줌된 화면 안에 있을 때만)
                    if (this.isInCameraView(game.camera) && Math.random() < 0.1) {
                        const dist = this.getDistanceToCamera(game.camera);
                        soundManager.playZoneDamage(dist);
                    }
                }

                this.decideState(game);
                this.executeState(game);

                this.pos.add(this.vel);

                // 정체 시 강제 이동
                if (this.vel.mag() < 0.15) {
                    this.stuckTimer++;
                    if (this.stuckTimer > 180) {
                        const nudgeAngle = random(0, Math.PI * 2);
                        const nudge = new Vector2(Math.cos(nudgeAngle), Math.sin(nudgeAngle)).mult(this.getMoveSpeed());
                        this.vel.add(nudge);
                        this.wanderAngle = nudgeAngle;
                        this.stuckTimer = 0;
                    }
                } else {
                    this.stuckTimer = 0;
                }
                
                // 원형 맵 경계 체크
                const distFromCenter = distance(this.pos, new Vector2(0, 0));
                if (distFromCenter + this.size > CONFIG.mapRadius) {
                    const angle = Math.atan2(this.pos.y, this.pos.x);
                    this.pos.x = Math.cos(angle) * (CONFIG.mapRadius - this.size);
                    this.pos.y = Math.sin(angle) * (CONFIG.mapRadius - this.size);
                }
                
                this.vel.mult(0.85); // Less friction for snappier movement
            }

            updateBuffs(game) {
                if (!this.activeBuffs.length) return;
                for (let i = this.activeBuffs.length - 1; i >= 0; i--) {
                    const buff = this.activeBuffs[i];
                    buff.remaining--;
                    if (buff.tickInterval) {
                        buff.tickCountdown--;
                        if (buff.tickCountdown <= 0) {
                            if (buff.tick) buff.tick(this, game);
                            buff.tickCountdown = buff.tickInterval;
                        }
                    }
                    if (buff.remaining <= 0) {
                        if (buff.remove) buff.remove(this, game);
                        this.activeBuffs.splice(i, 1);
                    }
                }
            }

            addBuff(buffKey, game) {
                const def = BUFF_DEFS[buffKey];
                if (!def) return;
                const existing = this.activeBuffs.find(buff => buff.key === def.key);
                if (existing) {
                    existing.remaining = def.duration * 60;
                    existing.tickCountdown = def.tickIntervalFrames || null;
                    return;
                }
                if (def.apply) def.apply(this, game);
                this.activeBuffs.push({
                    key: def.key,
                    icon: def.icon,
                    color: def.color,
                    remaining: def.duration * 60,
                    tickInterval: def.tickIntervalFrames || null,
                    tickCountdown: def.tickIntervalFrames || null,
                    tick: def.tick || null,
                    remove: def.remove || null
                });
                game.addFloatingText(`${def.icon} 버프`, this.pos.x, this.pos.y - 45, def.color || '#fff');
            }

            decideState(game) {
                // 자기장 밖에 있으면 가장 높은 우선순위로 맵 중앙으로 이동
                if (!game.safeZone.isInside(this.pos)) {
                    this.state = 'flee_zone';
                    this.target = null; // 맵 중앙(0, 0)으로 이동
                    return;
                }

                let nearestEnemy = null;
                let nearestDist = Infinity;

                for (let other of game.characters) {
                    if (other === this || !other.alive) continue;
                    const d = distance(this.pos, other.pos);
                    if (d < nearestDist) {
                        nearestDist = d;
                        nearestEnemy = other;
                    }
                }

                let nearestItem = null;
                let itemDist = Infinity;
                for (let item of game.items) {
                    if (!item.active) continue;
                    // 자기장 안쪽에 있는 아이템만 찾기
                    if (!game.safeZone.isInside(item.pos)) continue;
                    // Avoid traps unless stupid? Let's say they avoid traps if they see them
                    if (item.data.type === 'trap') continue;

                    const d = distance(this.pos, item.pos);
                    if (d < itemDist) {
                        itemDist = d;
                        nearestItem = item;
                    }
                }

                // Aggressive Logic
                const attackRange = (this.weapon ? this.weapon.range : 40) * 1.2;

                // 자기장 안쪽에 있는 적만 공격
                if (nearestEnemy && !game.safeZone.isInside(nearestEnemy.pos)) {
                    nearestEnemy = null; // 자기장 밖의 적은 무시
                }

                // 무기가 없는 경우, 무기가 있는 적을 만나면 아이템을 우선 파밍
                if (!this.weapon && nearestEnemy && nearestEnemy.weapon && nearestDist < this.detectRange) {
                    // 무기 아이템을 우선적으로 찾기
                    let weaponItem = null;
                    let weaponItemDist = Infinity;
                    for (let item of game.items) {
                        if (!item.active || item.data.type !== 'weapon') continue;
                        if (!game.safeZone.isInside(item.pos)) continue;
                        const d = distance(this.pos, item.pos);
                        if (d < weaponItemDist && d < this.detectRange) {
                            weaponItemDist = d;
                            weaponItem = item;
                        }
                    }
                    if (weaponItem) {
                        this.state = 'seek_item';
                        this.target = weaponItem;
                        return;
                    }
                }

                const wantsItem = nearestItem && game.safeZone.isInside(nearestItem.pos) && (
                    itemDist < this.detectRange * 0.85 ||
                    this.health < this.maxHealth * 0.55 ||
                    !this.weapon ||
                    this.weapon === ITEM_TYPES.SWORD ||
                    nearestItem.data.type === 'weapon'
                );

                if (wantsItem && (!nearestEnemy || nearestDist > attackRange * 0.6)) {
                    this.state = 'seek_item';
                    this.target = nearestItem;
                    return;
                }

                // 적을 우선적으로 공격 (더 적극적으로)
                if (nearestEnemy && nearestDist < attackRange) {
                    // 전투 시작 사운드 (상태가 변경될 때만, 줌된 화면 안에 있을 때만)
                    if (this.state !== 'attack' && (this.isInCameraView(game.camera) || nearestEnemy.isInCameraView(game.camera))) {
                        const dist = Math.min(this.getDistanceToCamera(game.camera), nearestEnemy.getDistanceToCamera(game.camera));
                        soundManager.playCombatStart(dist);
                    }
                    this.state = 'attack';
                    this.target = nearestEnemy;
                } else if (nearestEnemy && nearestDist < this.detectRange * 1.15) {
                    // 추적 범위를 더 넓게 (더 적극적으로)
                    this.state = 'chase';
                    this.target = nearestEnemy;
                } else {
                    this.state = 'wander';
                    this.target = null;
                }
            }

            executeState(game) {
                const desired = new Vector2(0, 0);
                const moveSpeed = this.getMoveSpeed();

                // 유효하지 않은 타겟 정리
                if (this.state === 'seek_item' && this.target && (!this.target.active || !game.safeZone.isInside(this.target.pos))) {
                    this.target = null;
                    this.state = 'wander';
                }
                if ((this.state === 'chase' || this.state === 'attack') && this.target && (!this.target.alive)) {
                    this.target = null;
                    this.state = 'wander';
                }

                if (this.state === 'flee_zone') {
                    const toCenter = new Vector2(0, 0).copy().sub(this.pos);
                    toCenter.normalize();
                    desired.x = toCenter.x;
                    desired.y = toCenter.y;
                    desired.mult(moveSpeed * 1.5);
                } else if (this.state === 'wander') {
                    if (!game.safeZone.isInside(this.pos)) {
                        const toCenter = new Vector2(0, 0).copy().sub(this.pos);
                        toCenter.normalize();
                        desired.x = toCenter.x;
                        desired.y = toCenter.y;
                        desired.mult(moveSpeed * 1.2);
                    } else {
                        if (Math.random() < 0.05) this.wanderAngle = random(0, Math.PI * 2);
                        desired.x = Math.cos(this.wanderAngle || 0);
                        desired.y = Math.sin(this.wanderAngle || 0);
                        desired.mult(moveSpeed * 0.6);
                    }
                } else if (this.state === 'chase' && this.target) {
                    desired.x = this.target.pos.x - this.pos.x;
                    desired.y = this.target.pos.y - this.pos.y;
                    desired.normalize().mult(moveSpeed);
                } else if (this.state === 'seek_item' && this.target) {
                    desired.x = this.target.pos.x - this.pos.x;
                    desired.y = this.target.pos.y - this.pos.y;
                    desired.normalize().mult(moveSpeed);

                    if (distance(this.pos, this.target.pos) < this.size + this.target.size) {
                        this.consumeItem(this.target, game);
                    }
                } else if (this.state === 'attack' && this.target) {
                    // 공격 방향으로 무기 방향 설정
                    this.facingAngle = Math.atan2(this.target.pos.y - this.pos.y, this.target.pos.x - this.pos.x);
                    
                    if (this.weapon && distance(this.pos, this.target.pos) < this.weapon.range * 0.5) {
                        desired.x = this.pos.x - this.target.pos.x;
                        desired.y = this.pos.y - this.target.pos.y;
                        desired.normalize().mult(moveSpeed);
                    } else {
                        desired.mult(0);
                    }

                    if (this.cooldown <= 0) {
                        this.attack(this.target, game);
                    }
                } else if (this.state === 'chase' && this.target) {
                    // 추적 중에도 타겟 방향으로 무기 방향 설정
                    this.facingAngle = Math.atan2(this.target.pos.y - this.pos.y, this.target.pos.x - this.pos.x);
                }

                const steer = desired.sub(this.vel);
                steer.mult(0.15);
                this.vel.add(steer);

                // Trap collision check
                for (let item of game.items) {
                    if (item.active && item.data.type === 'trap' && distance(this.pos, item.pos) < this.size + item.size) {
                        this.triggerTrap(item, game);
                    }
                }
            }

            attack(target, game) {
                this.cooldown = this.weapon ? this.weapon.cooldown : this.maxCooldown;
                this.facingAngle = Math.atan2(target.pos.y - this.pos.y, target.pos.x - this.pos.x);

                const attackDamage = this.weapon ? this.weapon.damage : this.damage;

                if (this.weapon && this.weapon.projectile) {
                    // Ranged Attack
                    let projectileDamage = attackDamage;
                    if (this.weapon.name === '소총') {
                        projectileDamage *= 0.6; // 소폭 버프: 0.5 -> 0.6으로 완화
                    }
                    game.projectiles.push(new Projectile(this, this.pos.x, this.pos.y, target, this.weapon.projectile, projectileDamage));
                    if (this.isInCameraView(game.camera) || target.isInCameraView(game.camera)) {
                        const dist = Math.min(this.getDistanceToCamera(game.camera), target.getDistanceToCamera(game.camera));
                        soundManager.playAttack(dist);
                    }
                } else {
                    // Melee Attack (칼 또는 무기 없음)
                    game.addParticle(target.pos.x, target.pos.y, '#ffffff', 5);
                    target.takeDamage(attackDamage, this, game);
                    const dir = target.pos.copy().sub(this.pos).normalize().mult(8);
                    this.vel.add(dir);
                    if (this.isInCameraView(game.camera) || target.isInCameraView(game.camera)) {
                        const dist = Math.min(this.getDistanceToCamera(game.camera), target.getDistanceToCamera(game.camera));
                        soundManager.playAttack(dist);
                    }
                }
            }

            takeDamage(amount, attacker, game) {
                const actualDamage = amount * (1 - this.defense);
                this.health -= actualDamage;
                game.addFloatingText(Math.floor(actualDamage), this.pos.x, this.pos.y - 20, '#169976');
                if (this.isInCameraView(game.camera) || (attacker && attacker.isInCameraView && attacker.isInCameraView(game.camera))) {
                    const dist = Math.min(this.getDistanceToCamera(game.camera), attacker ? attacker.getDistanceToCamera(game.camera) : Infinity);
                    soundManager.playHit(dist);
                }

                // 매직 지팡이 공격 시 20% 확률로 스턴
                if (attacker && attacker.weapon && attacker.weapon.name === '마법 지팡이' && Math.random() < 0.2) {
                    this.stunned = true;
                    this.stunTime = 60; // 1초간 스턴
                    game.addFloatingText("스턴!", this.pos.x, this.pos.y - 40, '#8b5cf6');
                }

                if (this.health <= 0) {
                    this.die(game);
                    if (attacker) attacker.onKill(game);
                }
            }

            onKill(game) {
                this.kills++;
                this.health = Math.min(this.health + 40, this.maxHealth); // 킬 보상
                game.spawnKillRewards(this);
                game.addFloatingText("전리품 드랍!", this.pos.x, this.pos.y - 40, '#facc15');
                game.addParticle(this.pos.x, this.pos.y, '#facc15', 15);
                if (this.isInCameraView(game.camera)) {
                    const dist = this.getDistanceToCamera(game.camera);
                    soundManager.playKill(dist);
                }
            }

            triggerTrap(trap, game) {
                if (!trap.active || trap.exploding) return;
                trap.exploding = true;
                trap.timer = 180; // 3초 후 폭발
                game.addFloatingText("지뢰 작동!", trap.pos.x, trap.pos.y - 20, '#169976');
            }

            consumeItem(item, game) {
                item.active = false;
                const data = item.data;

                if (data.type === 'consumable' || data.type === 'passive') {
                    data.effect(this, game);
                    if (this.isInCameraView(game.camera)) {
                        const dist = this.getDistanceToCamera(game.camera);
                        soundManager.playItemPickup(dist);
                    }
                } else if (data.type === 'weapon') {
                    this.weapon = data;
                    this.updateWeaponSpeed();
                    game.addFloatingText(`${data.name} 장착`, this.pos.x, this.pos.y - 30, '#fff');
                    if (this.isInCameraView(game.camera)) {
                        const dist = this.getDistanceToCamera(game.camera);
                        soundManager.playItemPickup(dist);
                    }
                } else if (data.type === 'buff' && data.buffKey) {
                    this.addBuff(data.buffKey, game);
                    if (this.isInCameraView(game.camera)) {
                        const dist = this.getDistanceToCamera(game.camera);
                        soundManager.playItemPickup(dist);
                    }
                }
            }

            die(game) {
                this.alive = false;
                for (let i = 0; i < 15; i++) {
                    game.addParticle(this.pos.x, this.pos.y, this.color, 10);
                }
                if (this.isInCameraView(game.camera)) {
                    const dist = this.getDistanceToCamera(game.camera);
                    soundManager.playDeath(dist);
                }
                // Drop loot? Maybe just simple for now.
                game.checkWinCondition();
            }

            draw(ctx) {
                if (!this.alive) return;

                // 캐릭터 발광 효과 (개성)
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                
                // Weapon Visual
                if (this.weapon) {
                    ctx.save();
                    ctx.translate(this.pos.x, this.pos.y);
                    ctx.rotate(this.facingAngle);
                    ctx.fillStyle = this.weapon.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.weapon.color;
                    ctx.fillRect(10, -2, 15, 4);
                    ctx.restore();
                }

                // Body - 개성있는 디자인
                const glowIntensity = 0.6 + Math.sin(Date.now() * 0.005 + this.id) * 0.2;
                ctx.globalAlpha = glowIntensity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.size + 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                
                // 내부 코어
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 외곽 링 (회전 효과 느낌)
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.size + 5, 0, Math.PI * 2);
                ctx.stroke();

                // Shield visual
                if (this.defense > 0) {
                    ctx.strokeStyle = '#169976';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#169976';
                    ctx.beginPath();
                    ctx.arc(this.pos.x, this.pos.y, this.size + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.shadowBlur = 0;

                // Health bar
                const hpPct = this.health / this.maxHealth;
                ctx.fillStyle = '#000000';
                ctx.fillRect(this.pos.x - 15, this.pos.y - 25, 30, 4);
                ctx.fillStyle = hpPct > 0.5 ? '#1DCD9F' : '#169976';
                ctx.fillRect(this.pos.x - 15, this.pos.y - 25, 30 * hpPct, 4);

                // Name & Weapon
                ctx.fillStyle = '#1DCD9F';
                ctx.font = '10px Outfit';
                ctx.textAlign = 'center';
                const weaponName = this.weapon ? `[${this.weapon.name}]` : '';
                ctx.fillText(`${this.name} ${weaponName}`, this.pos.x, this.pos.y + 30);

                if (this.activeBuffs.length) {
                    ctx.font = '12px Outfit';
                    this.activeBuffs.forEach((buff, idx) => {
                        const offset = (idx - (this.activeBuffs.length - 1) / 2) * 14;
                        ctx.fillStyle = buff.color || '#1DCD9F';
                        ctx.fillText(buff.icon, this.pos.x + offset, this.pos.y - 40);
                    });
                }
                
                // 스턴 상태 표시
                if (this.stunned) {
                    ctx.fillStyle = '#1DCD9F';
                    ctx.font = 'bold 12px Outfit';
                    ctx.fillText('⚡ 스턴', this.pos.x, this.pos.y + 45);
                }
            }
        }

        // --- Game Engine ---
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;

                this.characters = [];
                this.items = [];
                this.particles = [];
                this.projectiles = [];
                this.floatingTexts = [];
                this.camera = new Camera(this.width, this.height);
                this.time = 0;
                this.gameOver = false;
                this.destroyed = false;
                this.animationFrameId = null;

                this.init();
                this.loop = this.loop.bind(this);
                this.animationFrameId = requestAnimationFrame(this.loop);

                this.handleResize = () => {
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.canvas.width = this.width;
                    this.canvas.height = this.height;
                    this.camera.width = this.width;
                    this.camera.height = this.height;
                };
                window.addEventListener('resize', this.handleResize);
            }

            init() {
                // Safe Zone 초기화
                this.safeZone = new SafeZone();

                // 미니맵 캔버스 초기화
                this.minimapCanvas = document.getElementById('minimapCanvas');
                this.minimapCtx = this.minimapCanvas.getContext('2d');
                this.minimapCanvas.width = 200;
                this.minimapCanvas.height = 200;

                // Spawn Characters (원형 맵 내부에)
                for (let i = 0; i < CONFIG.entityCount; i++) {
                    const angle = random(0, Math.PI * 2);
                    const radius = random(100, CONFIG.mapRadius * 0.8);
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    const color = CONFIG.colors[i % CONFIG.colors.length];
                    this.characters.push(new Character(i, CHARACTER_NAMES[i] || `플레이어 ${i + 1}`, color, x, y));
                }

                // 초기 아이템 개수 줄임
                for (let i = 0; i < CONFIG.initialItemCount; i++) {
                    this.spawnItem();
                }

                this.lastItemSpawn = 0;
            }

            spawnItem() {
                // 자기장 안쪽에만 아이템 생성 (원형 맵 내부)
                let x, y;
                let attempts = 0;
                do {
                    const angle = random(0, Math.PI * 2);
                    const radius = random(50, CONFIG.mapRadius * 0.8);
                    x = Math.cos(angle) * radius;
                    y = Math.sin(angle) * radius;
                    attempts++;
                } while (!this.safeZone.isInside(new Vector2(x, y)) && attempts < 20);
                this.spawnItemAt(x, y);
            }

            spawnItemAt(x, y, forcedKey = null) {
                this.items.push(new Item(this.items.length, x, y, forcedKey));
            }

            spawnKillRewards(killer) {
                for (let i = 0; i < 2; i++) {
                    const dropKey = ITEM_LOOT_KEYS[Math.floor(Math.random() * ITEM_LOOT_KEYS.length)];
                    const angle = random(0, Math.PI * 2);
                    const distanceOffset = random(15, 40);
                    const x = killer.pos.x + Math.cos(angle) * distanceOffset;
                    const y = killer.pos.y + Math.sin(angle) * distanceOffset;
                    this.spawnItemAt(x, y, dropKey);
                }
            }

            addParticle(x, y, color, count = 1) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x, y, color));
                }
            }

            addFloatingText(text, x, y, color) {
                this.floatingTexts.push({
                    text, x, y, color, life: 1.0, velY: -1
                });
            }

            checkWinCondition() {
                const survivors = this.characters.filter(c => c.alive);
                document.getElementById('stats').innerText = `생존자: ${survivors.length} | 시간: ${Math.floor(this.time)}초`;

                if (survivors.length <= 1 && !this.gameOver) {
                    this.gameOver = true;
                    const winner = survivors[0] || { name: 'Draw', color: '#fff' };
                    this.showWinner(winner);
                }
            }

            showWinner(winner) {
                const overlay = document.getElementById('winner-overlay');
                const nameEl = document.getElementById('winner-name');
                nameEl.innerText = winner.name;
                nameEl.style.color = winner.color;
                overlay.classList.add('active');
            }

            update() {
                if (this.gameOver) return;

                this.time += 1 / 60;

                // Update Safe Zone
                this.safeZone.update(this);

                // Update Camera
                const aliveChars = this.characters.filter(c => c.alive);
                this.camera.update(aliveChars, this);

                // Update Entities
                this.characters.forEach(c => c.update(this));
                this.items.forEach(item => {
                    if (item.update) item.update(this);
                });
                this.projectiles.forEach((p, index) => {
                    p.update(this);
                    if (!p.active) this.projectiles.splice(index, 1);
                });

                // Update Particles
                this.particles.forEach((p, index) => {
                    p.update();
                    if (p.life <= 0) this.particles.splice(index, 1);
                });

                // Update Floating Texts
                this.floatingTexts.forEach((t, index) => {
                    t.y += t.velY;
                    t.life -= 0.02;
                    if (t.life <= 0) this.floatingTexts.splice(index, 1);
                });

                // 게임 중 지속적으로 아이템 생성 (더 자주)
                const activeItems = this.items.filter(i => i.active).length;
                if (this.time - this.lastItemSpawn > 1.2 && activeItems < 40) { // 약 1.2초마다, 최대 40개
                    this.spawnItem();
                    this.lastItemSpawn = this.time;
                }

                // 캐릭터 상태 UI 업데이트
                this.updateCharacterPanel();
            }

            updateCharacterPanel() {
                const listEl = document.getElementById('character-list');
                listEl.innerHTML = '';

                // 생존자 먼저, 사망자 나중에 (살아있는 캐릭터가 위쪽에)
                const sorted = [...this.characters].sort((a, b) => {
                    if (a.alive && !b.alive) return -1;
                    if (!a.alive && b.alive) return 1;
                    return b.kills - a.kills;
                });

                sorted.forEach(char => {
                    const card = document.createElement('div');
                    const isAlive = char.alive;
                    card.className = `character-card ${isAlive ? 'alive' : 'dead'}`;
                    
                    const hpPercent = (char.health / char.maxHealth) * 100;
                    let hpBarClass = 'hp-bar';
                    if (hpPercent < 30) hpBarClass += ' low';
                    else if (hpPercent < 60) hpBarClass += ' medium';
                    
                    const weaponName = char.weapon ? char.weapon.name : '근접';
                    const weaponText = char.weapon ? ` [${weaponName}]` : ' [근접]';
                    
                    card.innerHTML = `
                        <div class="character-card-header">
                            <div class="character-color-dot" style="background: ${char.color}"></div>
                            <div class="character-name">${char.name}${weaponText}</div>
                            <div class="character-hp">: ${Math.floor(char.health)}</div>
                        </div>
                        ${isAlive ? `
                        <div style="font-size: 0.7rem; color: rgba(226, 232, 240, 0.7); margin-top: 4px;">
                            킬: ${char.kills} | 공격력: ${Math.floor(char.damage)}${char.stunned ? ' | ⚡스턴' : ''}
                        </div>
                        <div class="stat-bar">
                            <div class="stat-bar-fill ${hpBarClass}" style="width: ${hpPercent}%"></div>
                        </div>
                        ` : ''}
                    `;
                    listEl.appendChild(card);
                });
            }

            draw() {
                // Clear with space background
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, this.width, this.height);

                // 카메라 변환 적용 전에 배경을 맵 좌표계로 그리기
                this.camera.apply(this.ctx);

                // 우주 배경 - 별들 (맵에 고정)
                this.ctx.fillStyle = '#1DCD9F';
                const starCount = 200;
                for (let i = 0; i < starCount; i++) {
                    const angle = (i / starCount) * Math.PI * 2;
                    const dist = 500 + (i % 5) * 800; // 맵 전체에 분산
                    const x = Math.cos(angle) * dist;
                    const y = Math.sin(angle) * dist;
                    const size = (i % 3 === 0 ? 1.5 : 1) * (0.5 + Math.sin(this.time * 2 + i) * 0.3);
                    this.ctx.globalAlpha = 0.6 + Math.sin(this.time * 3 + i) * 0.3;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = 1.0;

                // 우주 배경 - 원형 격자 (넓게, 맵에 고정)
                this.ctx.strokeStyle = 'rgba(22, 153, 118, 0.15)';
                this.ctx.lineWidth = 1;
                const gridSize = 800;
                for (let r = gridSize; r < CONFIG.mapRadius * 2; r += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, r, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 6) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(Math.cos(angle) * CONFIG.mapRadius * 2, Math.sin(angle) * CONFIG.mapRadius * 2);
                    this.ctx.stroke();
                }

                // Draw Map Boundaries (원형) - 우주 느낌
                this.ctx.strokeStyle = '#1DCD9F';
                this.ctx.lineWidth = 3;
                this.ctx.shadowBlur = 20;
                this.ctx.shadowColor = '#1DCD9F';
                this.ctx.beginPath();
                this.ctx.arc(0, 0, CONFIG.mapRadius, 0, Math.PI * 2);
                this.ctx.stroke();
                this.ctx.shadowBlur = 0;

                // Terrain features
                TERRAIN_FEATURES.forEach(feature => {
                    this.ctx.fillStyle = feature.color;
                    if (feature.type === 'circle') {
                        this.ctx.beginPath();
                        this.ctx.arc(feature.x, feature.y, feature.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                    } else if (feature.type === 'rect') {
                        this.ctx.fillRect(feature.x, feature.y, feature.width, feature.height);
                    }
                });

                // Draw Safe Zone
                this.safeZone.draw(this.ctx);

                // Draw Items
                this.items.forEach(i => i.draw(this.ctx, this.time));

                // Draw Projectiles
                this.projectiles.forEach(p => p.draw(this.ctx));

                // Draw Characters
                this.characters.forEach(c => c.draw(this.ctx));

                // Draw Particles
                this.particles.forEach(p => p.draw(this.ctx));

                // Draw Floating Texts
                this.floatingTexts.forEach(t => {
                    this.ctx.globalAlpha = t.life;
                    this.ctx.fillStyle = t.color;
                    this.ctx.font = 'bold 14px Outfit';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(t.text, t.x, t.y);
                    this.ctx.globalAlpha = 1.0;
                });

                this.camera.reset(this.ctx);

                // Draw Minimap
                this.drawMinimap();
            }

            drawMinimap() {
                const mm = this.minimapCtx;
                const size = 200;
                const scale = size / (CONFIG.mapRadius * 2);

                // Clear
                mm.fillStyle = '#0f172a';
                mm.fillRect(0, 0, size, size);

                // Draw map boundary
                mm.strokeStyle = '#334155';
                mm.lineWidth = 2;
                mm.beginPath();
                mm.arc(size / 2, size / 2, CONFIG.mapRadius * scale, 0, Math.PI * 2);
                mm.stroke();

                // Terrain features (minimap)
                TERRAIN_FEATURES.forEach(feature => {
                    mm.fillStyle = feature.color;
                    if (feature.type === 'circle') {
                        mm.beginPath();
                        mm.arc((feature.x + CONFIG.mapRadius) * scale, (feature.y + CONFIG.mapRadius) * scale, feature.radius * scale, 0, Math.PI * 2);
                        mm.fill();
                    } else if (feature.type === 'rect') {
                        mm.fillRect((feature.x + CONFIG.mapRadius) * scale, (feature.y + CONFIG.mapRadius) * scale, feature.width * scale, feature.height * scale);
                    }
                });

                // Draw safe zone
                if (this.safeZone.active) {
                    // 자기장 외부 영역 표시
                    mm.fillStyle = 'rgba(239, 68, 68, 0.2)';
                    mm.beginPath();
                    mm.arc(size / 2, size / 2, CONFIG.mapRadius * scale, 0, Math.PI * 2);
                    mm.arc(size / 2, size / 2, this.safeZone.radius * scale, 0, Math.PI * 2);
                    mm.fill('evenodd');
                    
                    // 자기장 경계선
                    mm.strokeStyle = '#169976';
                    mm.lineWidth = 3;
                    mm.setLineDash([5, 5]);
                    mm.beginPath();
                    mm.arc(size / 2, size / 2, this.safeZone.radius * scale, 0, Math.PI * 2);
                    mm.stroke();
                    mm.setLineDash([]);
                }

                // Draw items
                this.items.forEach(item => {
                    if (!item.active) return;
                    const x = (item.pos.x + CONFIG.mapRadius) * scale;
                    const y = (item.pos.y + CONFIG.mapRadius) * scale;
                    mm.fillStyle = item.data.color;
                    mm.beginPath();
                    mm.arc(x, y, 2, 0, Math.PI * 2);
                    mm.fill();
                });

                // Draw characters
                this.characters.forEach(char => {
                    if (!char.alive) return;
                    const x = (char.pos.x + CONFIG.mapRadius) * scale;
                    const y = (char.pos.y + CONFIG.mapRadius) * scale;
                    mm.fillStyle = char.color;
                    mm.beginPath();
                    mm.arc(x, y, 3, 0, Math.PI * 2);
                    mm.fill();
                });

                // Draw camera view (현재 보는 영역 표시)
                const camCenterX = (this.camera.x + this.camera.width / (2 * this.camera.zoom) + CONFIG.mapRadius) * scale;
                const camCenterY = (this.camera.y + this.camera.height / (2 * this.camera.zoom) + CONFIG.mapRadius) * scale;
                const viewWidth = (this.camera.width / this.camera.zoom) * scale;
                const viewHeight = (this.camera.height / this.camera.zoom) * scale;
                
                mm.strokeStyle = 'rgba(56, 189, 248, 0.5)';
                mm.lineWidth = 1;
                mm.strokeRect(camCenterX - viewWidth / 2, camCenterY - viewHeight / 2, viewWidth, viewHeight);
            }

            loop() {
                if (this.destroyed) return;
                this.update();
                this.draw();
                if (!this.gameOver) {
                    this.animationFrameId = requestAnimationFrame(this.loop);
                } else {
                    this.animationFrameId = null;
                }
            }

            destroy() {
                this.destroyed = true;
                this.gameOver = true;
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
                if (this.handleResize) {
                    window.removeEventListener('resize', this.handleResize);
                }
            }
        }

        // Start Game
        window.onload = () => {
            hydrateCharacterList({ restart: false });
            startSimulation();
            
            // 사용자 인터랙션 후 오디오 활성화
            const enableAudio = () => {
                soundManager.resumeAudio();
                document.removeEventListener('click', enableAudio);
                document.removeEventListener('keydown', enableAudio);
            };
            document.addEventListener('click', enableAudio);
            document.addEventListener('keydown', enableAudio);
        };
    </script>
</body>

</html>
